name: Build TPS Photo Import Backup Windows

on:
  push:
    branches:
      - photo-import-backup-build-20261008
    paths:
      - '.github/workflows/photo-import-backup-build.yml'
      - 'photo-import-backup/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: photo-import-backup

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Create pixel-sharp SD-card app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          @'
          from __future__ import annotations

          import io
          import struct
          from pathlib import Path
          from PIL import Image, ImageDraw

          # Unique TPS Photo Import identity: electric indigo + white SD card + lime backup arrow.
          INDIGO = (51, 61, 196, 255)
          INDIGO_DARK = (27, 31, 112, 255)
          WHITE = (255, 255, 255, 255)
          LIME = (205, 255, 72, 255)

          def make_small(size: int) -> Image.Image:
              # Tiny icons are drawn directly at their native size: no large artwork scaled down.
              im = Image.new("RGBA", (size, size), INDIGO)
              d = ImageDraw.Draw(im)
              m = max(1, size // 8)
              # SD card body.
              x0, y0 = m + 1, m + 1
              x1, y1 = int(size * .68), size - m - 1
              cut = max(2, size // 5)
              card = [(x0, y0), (x1-cut, y0), (x1, y0+cut), (x1, y1), (x0, y1)]
              d.polygon(card, fill=WHITE)
              # Card contacts.
              contact_y0 = y0 + max(2, size // 9)
              contact_y1 = contact_y0 + max(1, size // 8)
              for cx in range(x0 + 2, max(x0 + 3, x1-cut-1), max(2, size // 7)):
                  d.rectangle((cx, contact_y0, min(cx+1, x1-1), contact_y1), fill=INDIGO_DARK)
              # Bold lime backup arrow on right.
              ax = int(size * .73)
              d.rectangle((ax, int(size*.45), min(size-2, ax+max(1,size//8)), int(size*.78)), fill=LIME)
              d.polygon([
                  (int(size*.63), int(size*.51)),
                  (int(size*.78), int(size*.34)),
                  (int(size*.93), int(size*.51)),
              ], fill=LIME)
              return im

          def make_large(size: int) -> Image.Image:
              scale = 4
              s = size * scale
              def p(v): return int(round(v * s))
              im = Image.new("RGBA", (s, s), INDIGO)
              d = ImageDraw.Draw(im)
              # SD card dominates the icon.
              card = [(p(.12),p(.18)),(p(.56),p(.18)),(p(.70),p(.32)),(p(.70),p(.82)),(p(.12),p(.82))]
              d.polygon(card, fill=WHITE)
              d.polygon([(p(.56),p(.18)),(p(.56),p(.32)),(p(.70),p(.32))], fill=INDIGO_DARK)
              # Contacts.
              for x in (.19,.28,.37,.46,.55):
                  d.rounded_rectangle((p(x),p(.235),p(x+.045),p(.34)), radius=p(.01), fill=INDIGO_DARK)
              # Photo glyph inside SD card.
              d.rounded_rectangle((p(.20),p(.43),p(.61),p(.71)), radius=p(.035), fill=INDIGO_DARK)
              d.ellipse((p(.25),p(.48),p(.33),p(.56)), fill=WHITE)
              d.polygon([(p(.23),p(.68)),(p(.36),p(.56)),(p(.46),p(.65)),(p(.53),p(.58)),(p(.60),p(.68))], fill=WHITE)
              # Simple cloud in top-right.
              d.ellipse((p(.63),p(.12),p(.78),p(.27)), fill=WHITE)
              d.ellipse((p(.72),p(.08),p(.90),p(.28)), fill=WHITE)
              d.ellipse((p(.83),p(.15),p(.96),p(.29)), fill=WHITE)
              d.rectangle((p(.67),p(.21),p(.93),p(.29)), fill=WHITE)
              # Large lime upload arrow.
              d.rounded_rectangle((p(.75),p(.43),p(.83),p(.79)), radius=p(.015), fill=LIME)
              d.polygon([(p(.64),p(.50)),(p(.79),p(.34)),(p(.94),p(.50))], fill=LIME)
              return im.resize((size,size), Image.Resampling.LANCZOS)

          def make(size: int) -> Image.Image:
              return make_small(size) if size <= 24 else make_large(size)

          def png_bytes(im: Image.Image) -> bytes:
              buf = io.BytesIO()
              im.save(buf, format="PNG", optimize=False)
              return buf.getvalue()

          def write_ico(path: str, sizes: list[int]) -> None:
              blobs = [png_bytes(make(s)) for s in sizes]
              count = len(blobs)
              header = struct.pack("<HHH", 0, 1, count)
              offset = 6 + 16 * count
              entries = []
              for size, blob in zip(sizes, blobs):
                  wh = 0 if size >= 256 else size
                  entries.append(struct.pack(
                      "<BBBBHHII",
                      wh, wh, 0, 0, 1, 32, len(blob), offset
                  ))
                  offset += len(blob)
              Path(path).write_bytes(header + b"".join(entries) + b"".join(blobs))

          sizes = [16, 20, 24, 32, 40, 48, 64, 128, 256]
          make(256).save("assets/tps_photo_backup.png")
          make_large(1024).save("assets/tps_photo_backup_1024.png")
          write_ico("assets/tps_photo_backup.ico", sizes)
          write_ico("assets/favicon.ico", [16, 24, 32, 48])

          # Sanity-check that every requested size exists as a real ICO frame.
          ico = Image.open("assets/tps_photo_backup.ico")
          available = set(ico.info.get("sizes", []))
          expected = {(s, s) for s in sizes}
          missing = expected - available
          if missing:
              raise SystemExit(f"ICO missing sizes: {sorted(missing)}")
          print("ICO sizes:", sorted(available))
          '@ | Set-Content -Encoding UTF8 make_icon.py
          python make_icon.py

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile main.py tps_backup\backup_engine.py tps_backup\dropbox_client.py tps_backup\eventlog.py tps_backup\storage.py tps_backup\ui.py
          python -c "from tps_backup.ui import TPSApp, windows_camera_sd_candidates, windows_eject_removable_drive; required=['on_close','save_admin_settings','admin_connect_dropbox','start_pending_dropbox_sync','admin_add_event','monitor_sd_cards','sort_history_by','clear_history_filters','start_thumbnail_generation','apply_thumbnail','auto_sync_eventlog_queue','admin_test_eventlog','_on_mousewheel','on_issue_change','reset_import_screen','confirm_backup_details','auto_check_connections_on_load','apply_startup_connection_results']; missing=[x for x in required if not hasattr(TPSApp,x)]; assert not missing, f'Missing UI methods: {missing}'; assert callable(windows_camera_sd_candidates); assert callable(windows_eject_removable_drive); print('Source UI/SD detection/eject smoke check OK')"
          python -c "import dropbox; print('Dropbox SDK', dropbox.__version__)"
          python -c "from tps_backup.eventlog import EventLogClient; from tps_backup.storage import Storage; ok,msg=EventLogClient(Storage()).test_connection(); print('Event Log API:', ok, msg); assert ok"
          python -c "import compileall; assert compileall.compile_dir('.', quiet=1); from tps_backup.ui import TPSApp; assert hasattr(TPSApp,'on_close'); print('FINAL SOURCE VALIDATION OK')"

      - name: Build standalone EXE with explicit TPS package inclusion
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "TPS Photo Import & Backup" `
            --icon "assets\tps_photo_backup.ico" `
            --paths "." `
            --add-data "assets;assets" `
            --hidden-import "tps_backup" `
            --hidden-import "tps_backup.ui" `
            --hidden-import "tps_backup.backup_engine" `
            --hidden-import "tps_backup.storage" `
            --hidden-import "tps_backup.eventlog" `
            --hidden-import "tps_backup.dropbox_client" `
            --collect-submodules "tps_backup" `
            --collect-all "dropbox" `
            main.py

      - name: Verify TPS modules exist inside compiled EXE archive
        shell: pwsh
        run: |
          pyi-archive_viewer -l -r "dist\TPS Photo Import & Backup.exe" | Tee-Object -FilePath pyinstaller-archive.txt
          $archive = Get-Content pyinstaller-archive.txt -Raw
          foreach ($module in @("tps_backup.ui", "tps_backup.backup_engine", "tps_backup.storage", "tps_backup.dropbox_client", "tps_backup.eventlog")) {
            if ($archive -notmatch [regex]::Escape($module)) {
              throw "Compiled EXE archive is missing required module: $module"
            }
          }

      - name: Run compiled EXE self-test
        shell: pwsh
        run: |
          Remove-Item "tps_photo_import_self_test.txt" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path "dist\TPS Photo Import & Backup.exe") -ArgumentList "--self-test" -WorkingDirectory (Get-Location) -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path "tps_photo_import_self_test.txt") { Get-Content "tps_photo_import_self_test.txt" }
            throw "Compiled EXE self-test failed with exit code $($p.ExitCode)"
          }
          if (-not (Test-Path "tps_photo_import_self_test.txt")) {
            throw "Compiled EXE self-test did not produce its success marker."
          }
          $result = Get-Content "tps_photo_import_self_test.txt" -Raw
          Write-Host $result
          if ($result -notmatch "^OK 1\.2\.3") {
            throw "Unexpected compiled EXE self-test result: $result"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: TPS-Photo-Import-Backup-Windows-v1.2.4
          path: |
            photo-import-backup/dist/TPS Photo Import & Backup.exe
            photo-import-backup/dist/TPS.Photo.Import.Backup.Setup.v1.2.4.exe
          if-no-files-found: error

# v1.2.4 exact originals + pixel-sharp SD-card icon
