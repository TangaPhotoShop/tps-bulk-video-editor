name: Build TPS Photo Import Backup Windows

on:
  push:
    branches:
      - photo-import-backup-build-20261008
    paths:
      - '.github/workflows/photo-import-backup-build.yml'
      - 'photo-import-backup/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: photo-import-backup

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Create sharp SD-card TPS app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          @'
          from __future__ import annotations

          import io
          import struct
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          CARD = (17, 33, 48, 255)
          CARD_EDGE = (5, 15, 24, 255)
          LABEL = (0, 119, 182, 255)
          LABEL_DARK = (0, 76, 122, 255)
          WHITE = (255, 255, 255, 255)
          GOLD = (242, 184, 66, 255)

          FONT = Path("C:/Windows/Fonts/arialbd.ttf")

          def font(px: int):
              try:
                  return ImageFont.truetype(str(FONT), max(5, px))
              except Exception:
                  return ImageFont.load_default()

          def draw_card(d, size: int, inset: int):
              x0 = inset
              y0 = inset
              x1 = size - inset
              y1 = size - inset
              cut = max(2, int(size * 0.17))
              pts = [
                  (x0, y0),
                  (x1 - cut, y0),
                  (x1, y0 + cut),
                  (x1, y1),
                  (x0, y1),
              ]
              d.polygon(pts, fill=CARD, outline=CARD_EDGE)

          def make_small(size: int) -> Image.Image:
              # Native-size drawing avoids blur at 16-24 px.
              im = Image.new("RGBA", (size, size), (0,0,0,0))
              d = ImageDraw.Draw(im)
              inset = max(1, size // 16)
              draw_card(d, size, inset)

              # Gold SD contacts.
              top = max(2, int(size * .14))
              bottom = max(top + 1, int(size * .28))
              left = max(2, int(size * .16))
              right = int(size * .70)
              count = 4 if size <= 20 else 5
              gap = max(1, (right-left)//(count*2))
              w = max(1, gap)
              x = left
              for _ in range(count):
                  d.rectangle((x, top, min(x+w, right), bottom), fill=GOLD)
                  x += w + gap

              # White TPS is the only internal mark at tiny sizes.
              f = font(int(size * .31))
              bbox = d.textbbox((0,0), "TPS", font=f)
              tw = bbox[2]-bbox[0]
              th = bbox[3]-bbox[1]
              tx = (size - tw)//2
              ty = int(size * .60) - th//2
              d.text((tx, ty), "TPS", font=f, fill=WHITE)
              return im

          def make_large(size: int) -> Image.Image:
              # Large sizes render at 4x then downsample for clean curves.
              scale = 4
              s = size * scale
              im = Image.new("RGBA", (s, s), (0,0,0,0))
              d = ImageDraw.Draw(im)
              inset = max(4, int(s * .045))
              draw_card(d, s, inset)

              # SD contacts.
              top = int(s * .105)
              bottom = int(s * .255)
              left = int(s * .135)
              right = int(s * .69)
              count = 6
              gap = int(s * .018)
              w = int((right-left - gap*(count-1))/count)
              for i in range(count):
                  x0 = left + i*(w+gap)
                  d.rounded_rectangle((x0, top, x0+w, bottom), radius=max(1,int(s*.012)), fill=GOLD)

              # Blue label panel.
              lx0, ly0 = int(s*.12), int(s*.37)
              lx1, ly1 = int(s*.84), int(s*.82)
              d.rounded_rectangle((lx0,ly0,lx1,ly1), radius=int(s*.055), fill=LABEL, outline=LABEL_DARK, width=max(2,int(s*.012)))

              # Large centered TPS letters.
              f = font(int(s * .245))
              bbox = d.textbbox((0,0), "TPS", font=f)
              tw = bbox[2]-bbox[0]
              th = bbox[3]-bbox[1]
              tx = (s-tw)//2
              ty = int(s*.59) - th//2
              d.text((tx,ty), "TPS", font=f, fill=WHITE)

              return im.resize((size,size), Image.Resampling.LANCZOS)

          def make(size: int) -> Image.Image:
              return make_small(size) if size <= 24 else make_large(size)

          def png_bytes(im: Image.Image) -> bytes:
              buf = io.BytesIO()
              im.save(buf, format="PNG", optimize=False)
              return buf.getvalue()

          def write_ico(path: str, sizes: list[int]) -> None:
              blobs = [png_bytes(make(s)) for s in sizes]
              count = len(blobs)
              header = struct.pack("<HHH", 0, 1, count)
              offset = 6 + 16 * count
              entries = []
              for size, blob in zip(sizes, blobs):
                  wh = 0 if size >= 256 else size
                  entries.append(struct.pack("<BBBBHHII", wh, wh, 0, 0, 1, 32, len(blob), offset))
                  offset += len(blob)
              Path(path).write_bytes(header + b"".join(entries) + b"".join(blobs))

          sizes = [16,20,24,32,40,48,64,128,256]
          make(256).save("assets/tps_photo_backup.png")
          make_large(1024).save("assets/tps_photo_backup_1024.png")
          write_ico("assets/tps_photo_backup.ico", sizes)
          write_ico("assets/favicon.ico", [16,24,32,48])

          ico = Image.open("assets/tps_photo_backup.ico")
          available = set(ico.info.get("sizes", []))
          expected = {(s,s) for s in sizes}
          missing = expected - available
          if missing:
              raise SystemExit(f"ICO missing sizes: {sorted(missing)}")
          print("SD-card TPS ICO sizes:", sorted(available))
          '@ | Set-Content -Encoding UTF8 make_icon.py
          python make_icon.py

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile main.py tps_backup\backup_engine.py tps_backup\dropbox_client.py tps_backup\eventlog.py tps_backup\reference_sync.py tps_backup\storage.py tps_backup\ui.py
          python -c "from tps_backup.ui import TPSApp, windows_camera_sd_candidates, windows_eject_removable_drive; required=['on_close','save_admin_settings','admin_connect_dropbox','start_pending_dropbox_sync','admin_add_event','monitor_sd_cards','sort_history_by','clear_history_filters','start_thumbnail_generation','apply_thumbnail','auto_sync_eventlog_queue','admin_test_eventlog','_on_mousewheel','on_issue_change','reset_import_screen','confirm_backup_details','auto_check_connections_on_load','apply_startup_connection_results','refresh_backup_destination_labels','auto_sync_reference_data','schedule_reference_sync']; missing=[x for x in required if not hasattr(TPSApp,x)]; assert not missing, f'Missing UI methods: {missing}'; assert callable(windows_camera_sd_candidates); assert callable(windows_eject_removable_drive); print('Source UI/SD detection/eject smoke check OK')"
          python -c "import dropbox; from tps_backup.dropbox_client import DropboxBackupClient, DropboxUploadPaused; assert hasattr(DropboxBackupClient,'pause_job'); print('Dropbox SDK', dropbox.__version__, 'pause/resume OK')"
          python -c "from tps_backup.eventlog import EventLogClient; from tps_backup.storage import Storage; ok,msg=EventLogClient(Storage()).test_connection(); print('Event Log API:', ok, msg); assert ok"
          python -c "from tps_backup.reference_sync import ReferenceDataClient; from tps_backup.storage import Storage; d=ReferenceDataClient(Storage()).get(); print('Shared reference API:', d.get('initialized'), 'revision', d.get('revision')); assert d.get('ok')"
          python -c "import compileall; assert compileall.compile_dir('.', quiet=1); from tps_backup.ui import TPSApp; assert hasattr(TPSApp,'on_close'); print('FINAL SOURCE VALIDATION OK')"
          python -c "from PIL import Image; im=Image.open('assets/tps_photo_backup.ico'); expected={(16,16),(20,20),(24,24),(32,32),(40,40),(48,48),(64,64),(128,128),(256,256)}; assert expected.issubset(set(im.info.get('sizes',[]))); print('SD TPS icon frames verified')"

      - name: Build standalone EXE with explicit TPS package inclusion
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "TPS Photo Import & Backup" `
            --icon "assets\tps_photo_backup.ico" `
            --paths "." `
            --add-data "assets;assets" `
            --hidden-import "tps_backup" `
            --hidden-import "tps_backup.ui" `
            --hidden-import "tps_backup.backup_engine" `
            --hidden-import "tps_backup.storage" `
            --hidden-import "tps_backup.eventlog" `
            --hidden-import "tps_backup.reference_sync" `
            --hidden-import "tps_backup.dropbox_client" `
            --collect-submodules "tps_backup" `
            --collect-all "dropbox" `
            main.py

      - name: Verify TPS modules exist inside compiled EXE archive
        shell: pwsh
        run: |
          pyi-archive_viewer -l -r "dist\TPS Photo Import & Backup.exe" | Tee-Object -FilePath pyinstaller-archive.txt
          $archive = Get-Content pyinstaller-archive.txt -Raw
          foreach ($module in @("tps_backup.ui", "tps_backup.backup_engine", "tps_backup.storage", "tps_backup.dropbox_client", "tps_backup.eventlog", "tps_backup.reference_sync")) {
            if ($archive -notmatch [regex]::Escape($module)) {
              throw "Compiled EXE archive is missing required module: $module"
            }
          }

      - name: Run compiled EXE self-test
        shell: pwsh
        run: |
          Remove-Item "tps_photo_import_self_test.txt" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path "dist\TPS Photo Import & Backup.exe") -ArgumentList "--self-test" -WorkingDirectory (Get-Location) -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path "tps_photo_import_self_test.txt") { Get-Content "tps_photo_import_self_test.txt" }
            throw "Compiled EXE self-test failed with exit code $($p.ExitCode)"
          }
          if (-not (Test-Path "tps_photo_import_self_test.txt")) {
            throw "Compiled EXE self-test did not produce its success marker."
          }
          $result = Get-Content "tps_photo_import_self_test.txt" -Raw
          Write-Host $result
          if ($result -notmatch "^OK 1\.2\.9") {
            throw "Unexpected compiled EXE self-test result: $result"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: TPS-Photo-Import-Backup-Windows-v1.2.9
          path: |
            photo-import-backup/dist/TPS Photo Import & Backup.exe
            photo-import-backup/dist/TPS.Photo.Import.Backup.Setup.v1.2.9.exe
          if-no-files-found: error

# v1.2.9 keep backup action buttons visible on shorter/scaled displays
